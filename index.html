        }

            content: '';

            border: 2px solid #cbd5e1;
            pointer-events: none;
        }

            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #334155; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569; 
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .accordion-content {
            transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
        }
        .accordion-content.active {
            opacity: 1;
        }

        /* Glassmorphism Utilities */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);

        .glass-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        /* Loading Spinner */
        .loader {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #3b82f6;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Watch View Specific Styles */
        body.focus-mode-active nav,
        body.focus-mode-active .sidebar {
            display: none !important;
        }

        body.focus-mode-active .main-watch-container {
            width: 100vw !important;
            height: 100vh !important;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 50;
        }

        }

            color: #f1f5f9;
        }

        function render() {

                    break;
            }

            if(state.currentView !== 'landing' && state.currentView !== 'signup-student' && state.currentView !== 'watch') {
                app.innerHTML += renderAIAssistant();
            }

            initIcons();
            if(state.isChatOpen) {
                scrollToBottom('chat-history-global');
            }
            if(state.currentView === 'watch' && state.watchActiveTab === 'ai') {
                scrollToBottom('chat-history-watch');
            }
        }

        function scrollToBottom(id) {
            const element = document.getElementById(id);
            if (element) element.scrollTop = element.scrollHeight;
        }

        async function handleChatSubmit(inputId, historyId, context) {
            const inputEl = document.getElementById(inputId);
            const message = inputEl.value.trim();

            if (!message) return;

            state.chatMessages.push({ role: 'user', content: message });
            inputEl.value = ''; 
            state.isAiTyping = true;
            render();

            let aiResponse = "";
            if (AI_CONFIG.apiKey && AI_CONFIG.apiKey.length > 10) {
                aiResponse = await callOpenAI(state.chatMessages, context);
            } else {
                aiResponse = await simulateAIResponse(message, context);
            }

            state.isAiTyping = false;
            state.chatMessages.push({ role: 'assistant', content: aiResponse });
            render();
        }

        async function callOpenAI(history, context) {
            try {
                let systemMsg = AI_CONFIG.systemPrompt;
                if (context === 'watch' && state.selectedCourse) {
                    const course = courses.find(c => c.id === state.selectedCourse);
                    systemMsg += ` L'utilisateur regarde : ${course.title}.`;
                }
                const messagesPayload = [
                    { role: "system", content: systemMsg },
                    ...history.slice(-10)
                ];
                const response = await fetch("https://api.openai.com/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${AI_CONFIG.apiKey}`
                    },
                    body: JSON.stringify({
                        model: AI_CONFIG.model,
                        messages: messagesPayload,
                        temperature: 0.7
                    })
                });
                const data = await response.json();
                if(data.error) throw new Error(data.error.message);
                return data.choices[0].message.content;
            } catch (error) {
                console.error("AI Error:", error);
                return "Erreur serveur IA.";
            }
        }

        // --- IMPROVED AI LOGIC ---
        function simulateAIResponse(userMsg, context) {
            const lowerMsg = userMsg.toLowerCase();
            return new Promise(resolve => {
                setTimeout(() => {
                    let response = "Je suis l'IA d'Echrahli. Vous pouvez me poser des questions sur nos cours ou la plateforme.";

                    // Contextual Logic
                    if (lowerMsg.includes('bonjour') || lowerMsg.includes('hello') || lowerMsg.includes('slt')) {
                        response = "Bonjour ! Comment puis-je vous aider à choisir votre formation ?";
                    }
                    // Price Logic
                    else if (lowerMsg.includes('prix') || lowerMsg.includes('combien')) {
                        response = "Nos cours commencent à partir de 1500 DZD. Les formations techniques comme Python ou le Dev Web sont généralement aux alentours de 2500-3000 DZD.";
                    }
                    // Course Specifics
                    else if (lowerMsg.includes('excel')) {
                        response = "Le cours 'Maîtrisez Microsoft Excel' couvre des fonctionnalités avancées comme les tableaux croisés dynamiques et les macros. Il est idéal pour améliorer votre productivité bureautique.";
                    }
                    else if (lowerMsg.includes('python')) {
                        response = "Python est un langage très demandé ! Notre formation 'Python pour Data Science' vous apprendra à manipuler des données avec Pandas et NumPy, parfait pour débuter dans l'analyse de données.";
                    }
                    else if (lowerMsg.includes('immobilier') || lowerMsg.includes('agent')) {
                        response = "Notre formation 'Agent Immobilier Certifié' est spécialement conçue pour le marché algérien. Elle couvre le cadre légal et les techniques de négoce pour vous lancer rapidement.";
                    }
                    else if (lowerMsg.includes('marketing') || lowerMsg.includes('réseaux sociaux')) {
                        response = "Le marketing digital est essentiel aujourd'hui. Notre cours couvre les stratégies Facebook/Instagram et la publicité ciblée pour promouvoir une activité.";
                    }
                    else if (lowerMsg.includes('dev') || lowerMsg.includes('web') || lowerMsg.includes('mern')) {
                        response = "Le développement Web (MERN) est notre formation la plus populaire ! Vous apprendrez à créer des sites web complets de A à Z avec MongoDB, Express, React et Node.js.";
                    }
                    // Platform Info
                    else if (lowerMsg.includes('echrahli') || lowerMsg.includes('plateforme')) {
                        response = "Echrahli est la première marketplace éducative en Algérie dédiée à l'apprentissage en ligne, offrant des cours vidéo de qualité et des certifications reconnues.";
                    }
                    else if (lowerMsg.includes('diplome') || lowerMsg.includes('certificat')) {
                        response = "Nous délivrons deux types de diplômes : l'E-Diploma (immédiat) et le Diplôme Physique expédié par Yalidine directement chez vous en Algérie.";
                    }
                    // Watch Context
                    else if (context === 'watch') {
                        response = "Je suis là pour vous aider pendant votre visionnage. Posez-moi une question sur le cours actuel ou un concept technique !";
                    }
                    
                    resolve(response);
                }, 1000);
            });
        }

            const icon = type === 'success' ? 'check-circle' : 'info';

            toast.className = `${colorClass} text-white px-6 py-4 rounded-lg shadow-2xl flex items-center gap-3 transform translate-x-full transition-transform duration-300 pointer-events-auto min-w-[300px]`;
            toast.innerHTML = `

            setTimeout(() => {

            const desc = document.getElementById('new-desc').value;

            let imageUrl = '';
            if(category.includes('Informatique')) imageUrl = 'https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=400';
            else if(category.includes('Business') || category.includes('Marketing')) imageUrl = 'https://images.unsplash.com/photo-1460925895917-afdab827c52f?w=400';
            else if(category.includes('Design')) imageUrl = 'https://images.unsplash.com/photo-1558655146-d09347e92766?w=400';
            else if(category.includes('Immobilier')) imageUrl = 'https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=400';
            else if(category.includes('Bureautique') || category.includes('Excel')) imageUrl = 'https://images.unsplash.com/photo-1543286386-713d57659598?w=400';
            else imageUrl = 'https://images.unsplash.com/photo-1516321318423-c06f85e504b3?w=400';

            const newCourse = {
                id: Date.now(),
                title: title,
                instructor: state.instructorName,
                rating: 0,
                reviews: 0,
                price: parseInt(price),
                image: imageUrl,

                state.currentView = 'instructor-course-success';

            if (content.style.maxHeight) {
                content.style.maxHeight = null;
                content.classList.remove('active');
                icon.style.transform = 'rotate(0deg)';
            } else {
                document.querySelectorAll('.accordion-content').forEach(el => {
                    el.style.maxHeight = null;
                    el.classList.remove('active');
                });
                document.querySelectorAll('.lucide-chevron-down').forEach(el => {
                    el.style.transform = 'rotate(0deg)';
                });

                content.style.maxHeight = content.scrollHeight + "px";
                content.classList.add('active');
                icon.style.transform = 'rotate(180deg)';
            }
        }

                                <button onclick="setWatchTab('ai')" class="${isActive('ai')} px-4 py-3 text-sm font-medium whitespace-nowrap transition-colors flex items-center gap-2">AI Assistant</button>
                                <button onclick="setWatchTab('resources')" class="${isActive('resources')} px-4 py-3 text-sm font-medium whitespace-nowrap transition-colors">Ressources</button>
                                <button onclick="setWatchTab('ask')" class="${isActive('ask')} px-4 py-3 text-sm font-medium whitespace-nowrap transition-colors">Ask Professor</button>
                                <button onclick="setWatchTab('group')" class="${isActive('group')} px-4 py-3 text-sm font-medium whitespace-nowrap transition-colors">Rejoindre Groupe</button>
                            </div>

                            <div class="p-4 h-full">
                                ${state.watchActiveTab === 'notes' ? `
                                    <textarea class="w-full h-full bg-transparent text-slate-300 text-sm resize-none focus:outline-none placeholder-slate-600" placeholder="Prenez vos notes ici..."></textarea>
                                ` : ''}
                                
                                ${state.watchActiveTab === 'ai' ? `
                                    <div class="h-full flex flex-col">
                                        <div id="chat-history-watch" class="flex-1 overflow-y-auto mb-4 space-y-3 pr-2">
                                            ${state.chatMessages.map(msg => `
                                                <div class="flex gap-3 ${msg.role === 'user' ? 'flex-row-reverse' : ''}">
                                                    <div class="w-6 h-6 rounded-full ${msg.role === 'assistant' ? 'bg-blue-500/20 text-blue-400' : 'bg-slate-700 text-white'} flex items-center justify-center flex-shrink-0 text-xs">
                                                        <i data-lucide="${msg.role === 'assistant' ? 'bot' : 'user'}" class="w-3 h-3"></i>
                                                    </div>
                                                    <div class="${msg.role === 'assistant' ? 'bg-slate-800/80 border-slate-700' : 'bg-blue-600 text-white border-blue-500'} p-2 rounded-lg text-xs border max-w-[90%] ${msg.role === 'assistant' ? 'rounded-tl-none' : 'rounded-tr-none'}">
                                                        ${msg.content}
                                                    </div>
                                                </div>
                                            `).join('')}
                                            ${state.isAiTyping ? `
                                                <div class="flex gap-3">
                                                    <div class="w-6 h-6 rounded-full bg-blue-500/20 text-blue-400 flex items-center justify-center flex-shrink-0 text-xs">
                                                        <i data-lucide="bot" class="w-3 h-3"></i>
                                                    </div>
                                                    <div class="bg-slate-800/80 p-2 rounded-lg rounded-tl-none text-xs text-slate-400 border border-slate-700 flex items-center gap-1">
                                                        <span class="w-1 h-1 bg-slate-500 rounded-full animate-bounce"></span>
                                                        <span class="w-1 h-1 bg-slate-500 rounded-full animate-bounce" style="animation-delay: 0.1s"></span>
                                                        <span class="w-1 h-1 bg-slate-500 rounded-full animate-bounce" style="animation-delay: 0.2s"></span>
                                                    </div>
                                                </div>
                                            ` : ''}
                                        </div>
                                        <div class="relative mt-auto">
                                            <input id="ai-input-watch" type="text" placeholder="Parlez à l'IA..." class="w-full bg-slate-800 border border-slate-700 rounded-lg pl-3 pr-8 py-1.5 text-xs text-white focus:border-blue-500 outline-none">
                                            <button onclick="handleChatSubmit('ai-input-watch', 'chat-history-watch', 'watch')" class="absolute right-2 top-1.5 text-blue-500"><i data-lucide="send" class="w-3 h-3"></i></button>
                                        </div>
                                    </div>
                                ` : ''}

                                ${state.watchActiveTab === 'resources' ? `
                                    <div class="space-y-3">
                                        <div class="flex items-center justify-between p-3 bg-slate-800/50 rounded-lg border border-slate-700 hover:border-blue-500 transition-colors cursor-pointer">
                                            <div class="flex items-center gap-3">
                                                <div class="bg-blue-500/20 p-2 rounded text-blue-400"><i data-lucide="file-text" class="w-4 h-4"></i></div>
                                                <span class="text-sm font-medium">Slides de présentation (PDF)</span>
                                            </div>
                                            <i data-lucide="download" class="w-4 h-4 text-slate-400 hover:text-white"></i>
                                        </div>
                                        <div class="flex items-center justify-between p-3 bg-slate-800/50 rounded-lg border border-slate-700 hover:border-blue-500 transition-colors cursor-pointer">
                                            <div class="flex items-center gap-3">
                                                <div class="bg-purple-500/20 p-2 rounded text-purple-400"><i data-lucide="code" class="w-4 h-4"></i></div>
                                                <span class="text-sm font-medium">Code source (ZIP)</span>
                                            </div>
                                            <i data-lucide="download" class="w-4 h-4 text-slate-400 hover:text-white"></i>
                                        </div>
                                        <div class="flex items-center justify-between p-3 bg-slate-800/50 rounded-lg border border-slate-700 hover:border-blue-500 transition-colors cursor-pointer">
                                            <div class="flex items-center gap-3">
                                                <div class="bg-emerald-500/20 p-2 rounded text-emerald-400"><i data-lucide="link" class="w-4 h-4"></i></div>
                                                <span class="text-sm font-medium">Liens utiles (Notion)</span>
                                            </div>
                                            <i data-lucide="external-link" class="w-4 h-4 text-slate-400 hover:text-white"></i>
                                        </div>
                                    </div>
                                ` : ''}

                                ${state.watchActiveTab === 'ask' ? `
                                    <div class="h-full flex flex-col">
                                        <label class="text-sm font-medium text-slate-300 mb-2">Poser une question au professeur</label>
                                        <textarea id="prof-question" class="flex-1 w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-sm text-white focus:border-blue-500 outline-none resize-none mb-3" placeholder="Je n'ai pas compris le concept de..."></textarea>
                                        <button onclick="sendQuestionToProf()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 rounded-lg text-sm flex items-center justify-center gap-2">
                                            <i data-lucide="send" class="w-4 h-4"></i> Envoyer
                                        </button>
                                    </div>
                                ` : ''}

                                ${state.watchActiveTab === 'group' ? `
                                    <div class="flex flex-col items-center justify-center h-full text-center space-y-4">
                                        <div class="w-16 h-16 rounded-full bg-blue-500/10 flex items-center justify-center text-blue-400">
                                            <i data-lucide="users" class="w-8 h-8"></i>
                                        </div>
                                        <div>
                                            <h3 class="text-white font-semibold">Communauté des étudiants</h3>
                                            <p class="text-xs text-slate-400 mt-1 mb-4">Rejoignez plus de 500 étudiants pour discuter.</p>
                                        </div>
                                        <button class="bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 px-6 rounded-full text-sm flex items-center gap-2 transition-all">
                                            <i data-lucide="send" class="w-4 h-4"></i> Rejoindre la communauté Telegram/Discord
                                        </button>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>

                    <div class="sidebar w-full md:w-80 bg-slate-900 border-l border-slate-800 flex flex-col shrink-0 h-1/3 md:h-full z-20">
                        <div class="p-4 border-b border-slate-800 bg-slate-900">
                            <h3 class="font-bold text-sm text-slate-300 uppercase tracking-wider">Contenu du cours</h3>
                            <p class="text-xs text-slate-500 mt-1">${courseLessons.length} Leçons</p>
                        </div>
                        
                        <div class="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-1">
                            ${courseLessons.map((lesson, index) => {
                                const isActive = index === currentLessonIndex;
                                return `
                                    <div 
                                        onclick="changeLesson(${index})" 
                                        class="cursor-pointer rounded transition-all duration-200 p-3 flex items-center gap-3 hover:bg-slate-800 group border-l-4 border-transparent
                                        ${isActive ? 'active-lesson' : 'text-slate-400'}"
                                    >
                                        <div class="w-6 h-6 rounded-full border flex items-center justify-center text-xs shrink-0
                                            ${isActive ? 'border-blue-500 text-blue-500' : 'border-slate-600 group-hover:border-slate-400'}">
                                            ${isActive 
                                                ? '<i data-lucide="play" class="w-3 h-3 fill-current"></i>' 
                                                : `<span class="${isActive ? 'text-blue-500' : 'text-slate-500'}">${index + 1}</span>`
                                            }
                                        </div>
                                        
                                        <div class="text-sm font-medium truncate ${isActive ? 'text-white' : 'group-hover:text-slate-200'}">
                                            ${lesson.title}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function sendQuestionToProf() {
            const questionInput = document.getElementById('prof-question');
            if (questionInput && questionInput.value.trim() !== "") {
                showToast("Votre message a été envoyé avec succès ! Le professeur vous répondra bientôt.", "success");
                questionInput.value = ""; 
            } else {
                showToast("Veuillez écrire une question.", "info");
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            render();
        });
    </script>
</body>
</html>
